name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # El repo aún tiene deuda preexistente de lint (ver CLAUDE.md / D-006-W en el registro
  # interno de deuda técnica — ~75 avisos de `ng lint`, ~246 de `stylelint`, 125 archivos sin
  # formatear). Este job corre e informa en el PR para que la deuda sea visible, pero no
  # bloquea el merge (`continue-on-error: true`) hasta que se limpie la base; en ese
  # momento, quitar `continue-on-error` para que pase a ser gate real.
  lint:
    name: Lint (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:style
      - run: npm run format:check

  # Gate real desde 2026-09-01: la suite quedó 100% verde (TP-001-W/TP-002-W resueltos,
  # deuda completa del registro interno de tests pagada) — un test roto ahora bloquea
  # el merge, ya no solo informa.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test
