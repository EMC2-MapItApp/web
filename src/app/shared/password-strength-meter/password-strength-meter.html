@if (score() !== null) {
  <div class="strength-meter" [attr.data-tier]="tier()">
    <div class="strength-meter__bars">
      @for (bar of bars; track $index) {
        <span class="strength-meter__bar" [class.filled]="$index < filledBars()"></span>
      }
    </div>
    @if (showLabel()) {
      <span class="strength-meter__label">{{ label() }}</span>
    }
  </div>
}
