<div class="check-email-dialog" (click)="$event.stopPropagation()">

  <button class="close-btn" mat-icon-button (click)="dialogRef.close()" aria-label="Cerrar">
    <mat-icon>close</mat-icon>
  </button>

  <div class="check-email-dialog__icon">
    <mat-icon>mark_email_unread</mat-icon>
  </div>

  <h2 class="check-email-dialog__title">Revisa tu bandeja de entrada</h2>

  <p class="check-email-dialog__subtitle">
    Te hemos enviado un enlace de verificación a<br />
    <strong>{{ data.email }}</strong>.<br />
    Ábrelo para activar tu cuenta.
  </p>

  <div class="check-email-dialog__actions">
    <button mat-stroked-button class="btn-resend" [disabled]="resending() || resendCooldownLeft() > 0"
            (click)="resend()">
      @if (resending()) {
        <mat-spinner diameter="18" />
      } @else if (resendCooldownLeft() > 0) {
        Reenviar en {{ resendCooldownLeft() }}s
      } @else {
        Reenviar correo
      }
    </button>
    <button mat-flat-button class="btn-login" (click)="goToLogin()">
      Ir a iniciar sesión
    </button>
  </div>

  <p class="check-email-dialog__hint">El enlace caduca en 20 minutos</p>
</div>
