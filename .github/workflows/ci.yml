name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # Gate real desde 2026-09-03: la deuda preexistente de lint/stylelint/formato (D-006-W en el
  # registro interno de deuda técnica) se pagó por completo — 0 avisos de `ng lint`, 0 de
  # `stylelint`, 0 archivos sin formatear. Un aviso nuevo ahora bloquea el merge.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:style
      - run: npm run format:check

  # Gate real desde 2026-09-01: la suite quedó 100% verde (TP-001-W/TP-002-W resueltos,
  # deuda completa del registro interno de tests pagada) — un test roto ahora bloquea
  # el merge, ya no solo informa.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test
